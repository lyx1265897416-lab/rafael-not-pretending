function closeChoice(){ $('sheet').classList.remove('show'); subs.style.bottom = ''; $('shade').classList.remove('deep'); }
$('say').addEventListener('submit', e => { e.preventDefault(); const raw = $('sayIn').value.trim(); if (!raw || busy) return; liveRound('free', null, {zh: raw, en: raw}); });

// 一轮：发出去 → 等导演层和两段生成 → 两段都好、都缓冲好 → 一次连续播完 → 下一个选择点
let liveRun = 0;
async function liveRound(kind, choice, said){
  if (!K){ toast(T('Live scenes need the test link with a key', '实时生成需要带口令的测试链接')); return; }
  if (busy) return; busy = true; const my = ++liveRun, t0 = Date.now(); let r = null, rid = null;
  closeChoice(); setMode('waiting'); waitMusic(true); showSub(null);
  const herLine = lang === 'en' ? (said.en || said.zh) : (said.zh || said.en);
  $('lwH').textContent = T('You: ', '你：') + herLine;
  const phase = () => !r ? T('Sending…', '发送中…') : r.status === 'keyframe' ? T('Setting up the next moment…', '正在准备下一刻的画面…') : r.status === 'submitted' ? (kind === 'option' ? T('Reading the storyboard for this choice…', '读取这个选项预先写好的分镜…') : T('Writing his reply…', '导演层在写他的回话…')) : r.status === 'error' ? T('Generation failed', '生成失败')
    : (r.segs && r.segs[0] && r.segs[0].url && r.segs[1] && !r.segs[1].url) ? T(`Part 1 ready · part 2 in ~${(r.segs[1].eta_left || 0).toFixed(0)} s, timing the start so both play straight through`, `第 1 段好了 · 第 2 段约 ${(r.segs[1].eta_left || 0).toFixed(0)} 秒后好，算好时间开播，两段接着播`)
    : T(`Generating both parts at once (${r.mode.replace('+', ' s + ')} s) · ${(r.segs || []).filter(s => s.url).length}/2 ready`, `两段同时生成中（${r.mode.replace('+', ' 秒 + ')} 秒）· 已完成 ${(r.segs || []).filter(s => s.url).length}/2`);
  const hold = (label, cond) => new Promise(res => { $('liveWait').hidden = false; (function f(){ if (my !== liveRun) return; $('lwT').textContent = ((Date.now() - t0) / 1000).toFixed(1); $('lwS').textContent = label || phase(); if (cond()){ res(); } else setTimeout(f, 100); })(); });
  try { rid = (await api('/api/round', {sid, kind, choice, input: kind === 'free' ? said.zh : undefined})).id; }
  catch (e){ $('liveWait').hidden = true; busy = false; setChip('<b>Not sent</b> · ' + esc(e.message)); toast(T('Live generation unavailable', '实时生成不可用')); openChoice(); if (kind === 'free') $('sayIn').value = said.zh; return; }
  const V = [spare()]; V[0].dataset.keep = 1; V.push(spare()); delete V[0].dataset.keep; V.forEach(v => delete v.dataset.started);
  let polling = true;  // 一个请求回来再发下一个：隧道一来一回约 2 秒，定时每 0.5 秒发会叠出四五个请求，和视频抢网络；两段都出好就停
  (async () => { while (polling && my === liveRun){
    try { r = await api(`/api/round/${rid}?k=${encodeURIComponent(K)}`); } catch (e) {}
    if (r && r.segs) r.segs.forEach((s, i) => { const u = pick(V[i], s); if (u && V[i].dataset.src !== u){ V[i].dataset.src = u; load(V[i], u); } warm(V[i]); const f = s.url + JSON.stringify(s.flip || []); if (s.url && V[i].dataset.flip !== f){ V[i].dataset.flip = f; RT.flip(V[i], s.flip); } });  // 一到就预载；V3.6 左右对调的镜头由中转标出（flip），播到那几秒水平镜像
    if (r && (r.status === 'done' || r.status === 'error')) break;
    await new Promise(res => setTimeout(res, 500)); } })();
  // V1.5 提速：第 1 段不等第 2 段出片——按第 2 段的预计出片时间（中转给的 eta_left）倒推开播，第 1 段播完正好接上第 2 段
  const LOCAL = location.hostname === '127.0.0.1', M = LOCAL ? 1.5 : 3.0;  // 轮询、隧道延迟和第 2 段从 Vivix CDN 缓冲的余量（秒）
  const segErr = () => r && r.segs && r.segs.some(s => s.status === 'error');
  const seg1Ok = () => r && r.segs && r.segs[0] && r.segs[0].url && srcOf(r.segs[0]).includes(V[0].dataset.src) && enough(V[0], 99, 25000) && (V[0]._dl != null || (V[0]._dl = (Date.now() - V[0]._tl) / 1000), true);
  const seg2Soon = () => { const s2 = r.segs[1]; if (!s2) return true;
    if (s2.url){ const d1 = V[0].duration || r.segs[0].dur || 5, v = V[1]; if (!v._u0) v._u0 = Date.now();  // 11-05：第 2 段到了，按它实测的下载速度估：第 1 段播完前下得完才开播（宁可开头多等，不在中间停）；等 35 秒还估不出就照开
      return srcOf(s2).includes(v.dataset.src) && (bufEta(v) <= d1 - 2 || Date.now() - v._u0 > 35000); } const d1 = V[0].duration || r.segs[0].dur || 5; return s2.eta_left != null && s2.eta_left + (V[0]._dl != null ? V[0]._dl : 8) <= d1 - M - (s2.dur >= 15 ? 1.5 : 0); };  // 11-05：再留出浏览器下载第 2 段的时间（按第 1 段实测的下载用时）
  await hold(null, () => (r && r.status === 'error') || segErr() || (seg1Ok() && seg2Soon()));
  if (my !== liveRun){ polling = false; return; }
  const view = {};
  if (!segErr() && r.status !== 'error'){
    $('liveWait').hidden = true; waitMusic(false); setMode('playing');
    view.play_at = Date.now(); view.seg2_eta = r.segs[1] ? r.segs[1].eta_left : null;
    RT.begin({hist: {r: r, her: (typeof herLine !== 'undefined' ? herLine : (typeof said !== 'undefined' && said ? (said.zh || said.en || '') : ''))}, key: 'round:' + rid, mix: r.mix, parts: r.segs.map((x, i) => ({v: V[i], d: x.dur || x.seconds})), label: T(`Scene ${round + 1}`, `第 ${round + 1} 幕`)}); RT.part(0);
    await play(0); view.seg1_end = Date.now();
    const ok2 = () => segErr() || (r.segs[1].url && srcOf(r.segs[1]).includes(V[1].dataset.src) && enough(V[1], 99, 15000));
    if (!ok2()){ waitMusic(true); while (!ok2() && my === liveRun) await new Promise(res => setTimeout(res, 100)); waitMusic(false); }  // 第 2 段还没到：停在第 1 段最后一帧
    view.stall = (Date.now() - view.seg1_end) / 1000;
    if (my === liveRun && !segErr()){ RT.part(1); await play(1); RT.done('round:' + rid); }
  }
  polling = false; view.end_at = Date.now(); $('liveWait').hidden = true;
  if (rid) api(`/api/round/${rid}/view`, view).catch(() => {});
  const gen = r.segs && r.segs.every(s => s.ready_at) ? Math.max(...r.segs.map(s => s.ready_at - r.director_at)) / 1000 : null;
  const dir = r.director_at ? (r.director_at - r.at) / 1000 : null;
  busy = false;
  if (!view.play_at || segErr()){ const low = (r.segs || []).some(s => s.err_code === 10005); setChip(low ? '<b>Vivix balance low</b> · this scene was not generated (10005). Top up the Vivix workspace, then choose or send again here' : `<b>This scene failed</b> · ${esc((r.segs || []).map(s => s.err).filter(Boolean)[0] || r.err || '')} · you can choose again`); if (low) toast(T('Vivix balance low', 'Vivix 余额不足')); openChoice(); return; }
  setChip(`<b>Scene ${round + 1}</b> · ${esc(r.mode)} · send to play ${((view.play_at - t0) / 1000).toFixed(1)}s (director ${dir == null ? '—' : dir.toFixed(1)}s${r.director === 'prefetched' ? ' prefetched' : ''} + part 1 ${r.segs[0].ready_at ? ((r.segs[0].ready_at - r.director_at) / 1000).toFixed(1) : '—'}s, part 2 ${gen == null ? '—' : gen.toFixed(1)}s) · seam pause ${(view.stall || 0).toFixed(1)}s`);
  const sceneNo = round + 1;
  replayFn = () => {  // 重看：看过了，可以随意拖；两段之间拖动时直接跳到那一段
    const go = (j, t) => { const v = V[j]; subsFor(j, v); v.currentTime = t; v.muted = false; v.loop = false; v.onended = () => { v.ontimeupdate = null; showSub(null); if (j + 1 < V.length){ RT.part(j + 1); go(j + 1, 0); } else { v.onended = null; RT.clear(); openChoice(); } }; v.play().then(() => show(v)).catch(() => {}); };
    RT.begin({hist: {r: r, her: (typeof herLine !== 'undefined' ? herLine : (typeof said !== 'undefined' && said ? (said.zh || said.en || '') : ''))}, key: 'round:' + rid, mix: r.mix, free: true, parts: r.segs.map((x, i) => ({v: V[i], d: x.dur || x.seconds})), label: T(`Scene ${sceneNo}`, `第 ${sceneNo} 幕`), jump: (j, t) => { V.forEach(x => { if (x !== V[j]){ x.pause(); x.onended = null; x.ontimeupdate = null; } }); go(j, t); }});
    go(0, 0);
  };
  round++; next = r.next || next; addUnlock(r.unlock, round); openChoice();

  function subLine(i, v){
    const Lns = (r.lines['seg' + (i + 1)] || []).filter(Boolean), Z = ((r.zh || {})['seg' + (i + 1)] || []).filter(Boolean), off = i === 1 ? 2 : 0;  // 第 2 段前 2 秒是静止承接
    return () => { const d = v.duration || r.segs[i].seconds; const LT = (r.line_times || {})['seg' + (i + 1)]; if (LT){ const c = LT.find(x => v.currentTime >= x.s && v.currentTime <= x.e); if (c) showSub({en: c.en, zh: c.zh || ''}, c.who === '她' ? T('Her', '她') : c.who); else showSub(null); } else if (Lns.length){ const t = Math.max(0, v.currentTime - off); const k = Math.min(Lns.length - 1, Math.floor(t / (d - off) * Lns.length)); showSub({en: Lns[k], zh: Z[k] || ''}, 'Rafael'); } };
  }
  function subsFor(i, v){ const f = subLine(i, v); v.ontimeupdate = f; }
  function play(i){ return new Promise(res => {
    const v = V[i];
    v.dataset.started = rid; v.pause(); delete v.dataset.warm; try { v.playbackRate = v.defaultPlaybackRate || 1; } catch (e) {}  // 退出后台慢放，用回播放器选的倍速
    v.currentTime = 0; v.muted = false; v.loop = false; let done = false;
    const end = () => { if (done) return; done = true; v.ontimeupdate = null; showSub(null); res(); };
    const sub1 = subLine(i, v);
    v.ontimeupdate = () => { if (my !== liveRun){ end(); return; } sub1(); const d = v.duration || r.segs[i].seconds; if (d && v.currentTime >= d - 0.06) end(); };
    v.onended = end; v.onerror = end;
    v.play().then(() => show(v)).catch(() => { v.muted = true; v.play().then(() => show(v)).catch(end); });
  }); }
}
})();
</script>
